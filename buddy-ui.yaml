# Claude Buddy UI, shared by the dial (claude-buddy.yaml) and the desktop simulator (claude-buddy-sim.yaml).
# The including config supplies the board side with these ids: display `disp`, touchscreen `touch`, light
# `display_brightness`, binary sensors `btn_pwr` (PWR key) and `btn_boot` (BOOT key).
# Pets: buddy/character.h loads a character pack made by scripts/gen_buddy_pets.mjs (runs on every compile).
# Protocol: docs/DIAL-PROTOCOL.md. Host test: test_buddy.cpp.
# ui_root: the 466x466 object the UI builds on. The sim overrides it to sit the glass inside a bigger window.

substitutions:
  ui_root: lv_scr_act()

external_components:
  - source:
      type: local
      path: components
    components: [claude_buddy]

esphome:
  includes:
    - buddy  # character.h (pack: LittleFS on the dial, bridge/assets on the host), scene.h, ui.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            if (character::mount()) character::load("claude");
            buddyui::init(${ui_root}, id(buddy), {
                id(inter_20)->get_lv_font(), id(inter_25)->get_lv_font(), id(inter_26m)->get_lv_font(),
                id(inter_30)->get_lv_font(), id(inter_48b)->get_lv_font(),
                id(inter_96b)->get_lv_font()});
            buddyui::ui().on_state = [](const std::string &s) { id(buddy_ui).publish_state(s); };
            buddyui::ui().last_state.clear();  // init() drew before the sensor was attached: publish again
            buddyui::publish_state();

claude_buddy:
  id: buddy
  decision_sensor: buddy_decision
  on_update:
    - lambda: buddyui::update(millis());

# ---- Dial bridge (bridge/): every agent's status over Wi-Fi, as Hardware Buddy JSON lines ----
api:
  actions:
    - action: buddy_line
      variables:
        line: string
      then:
        - lambda: id(buddy).feed_line(line);
    # Remote touch: allow, deny, later, card, bell, hold, back, wake, screen, boot (buddy/ui.h tap()).
    - action: buddy_tap
      variables:
        target: string
      then:
        - lambda: buddyui::tap(target);

text_sensor:
  - platform: template
    id: buddy_decision
    name: Buddy Decision  # "<prompt id> once|deny"; the bridge subscribes to it
  - platform: template
    id: buddy_ui
    name: Buddy UI  # what's on the glass, JSON (docs/DIAL-PROTOCOL.md); the bridge reads the view
    entity_category: diagnostic

# ---- Fonts: Inter throughout (spec §2 Common) ----
font:
  - { id: inter_20, file: "gfonts://Inter@400", size: 20, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: "…·→" }
  - { id: inter_25, file: "gfonts://Inter@400", size: 25, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: "…·→" }
  - { id: inter_26m, file: "gfonts://Inter@500", size: 26, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: "…·→" }
  - { id: inter_30, file: "gfonts://Inter@400", size: 30, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: "…·→" }
  - { id: inter_48b, file: "gfonts://Inter@700", size: 48, bpp: 4, glyphs: "Claude" }
  - { id: inter_96b, file: "gfonts://Inter@800", size: 96, bpp: 4, glyphs: "0123456789%" }  # usage alarm

lvgl:
  id: lvgl_comp
  displays: [disp]
  # Paused while the screen is dark (interval below). A touch resumes it (resume_on_input, default on), the
  # shield takes the press and wakes the UI.
  on_resume:
    - lambda: id(lvgl_resumed_at) = millis();
  touchscreens: [touch]
  buffer_size: 25%  # largest ESPHome keeps in internal SRAM
  bg_color: 0x000000
  # ui.h builds the screen in C++ on lv_scr_act(). This label only keeps the LVGL font plumbing referenced.
  widgets:
    - label: { hidden: true, text: "", text_font: inter_20 }

interval:
  # Harness redraws code-drawn motion every 50 ms; pets step at 55-120 ms.
  - interval: 50ms
    then:
      - lambda: |-
          buddyui::tick(millis());
          if (buddyui::take_wake()) {
            id(lvgl_comp).set_paused(false, false);
            auto c = id(display_brightness).turn_on();
            c.set_transition_length(300);
            c.perform();
          }
          if (buddyui::take_sleep()) {
            auto c = id(display_brightness).turn_off();
            c.set_transition_length(1000);
            c.perform();
            id(lvgl_comp).set_paused(true, false);  // no renders or flushes while dark
          }
          // A touch resumed LVGL but didn't wake the UI (press missed the shield): pause again after 1 s.
          if (buddyui::ui().asleep && !id(lvgl_comp).is_paused() && millis() - id(lvgl_resumed_at) > 1000)
            id(lvgl_comp).set_paused(true, false);
          // New character pack on flash: reboot into it, but never under an open permission prompt.
          if (character::synced() && !id(buddy).has_prompt()) {
            ESP_LOGI("character", "New pack synced, rebooting");
            App.safe_reboot();
          }

globals:
  - id: lvgl_resumed_at
    type: uint32_t
    initial_value: "0"

binary_sensor:
  - id: !extend btn_pwr
    on_press:  # PWR tap toggles the screen (ptt.c:20-22); via the UI so a dark screen also eats touches
      - lambda: |-
          ESP_LOGD("btn", "PWR down");
          buddyui::toggle_screen(millis());
    on_release:
      - lambda: 'ESP_LOGD("btn", "PWR up");'
  - id: !extend btn_boot
    on_press:
      - lambda: 'ESP_LOGD("btn", "BOOT down");'
    on_release:
      - lambda: 'ESP_LOGD("btn", "BOOT up");'
    on_click:  # BOOT tap: "later" on a prompt, usage screen from the face, else back to the face (ui.h boot())
      - max_length: 600ms
        then:
          - lambda: buddyui::boot(millis());
