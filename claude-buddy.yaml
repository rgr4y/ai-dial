# Claude Buddy on the ex-Harness dial (Waveshare ESP32-S3-Touch-AMOLED-1.75C).
# Harness's Claude face (pets, arcs, cards; docs/HARNESS-UI-SPEC.md), driven over Wi-Fi by the dial bridge
# (bridge/: Claude Code hooks + peon-ping adapters for Codex, Cursor, ...).
# Board: dial-hardware.yaml. UI: buddy-ui.yaml. Desktop simulator of the same code: claude-buddy-sim.yaml.
# Protocol: docs/DIAL-PROTOCOL.md.
# The BLE transport for Claude desktop's Hardware Buddy is kept, unconfigured, in components/claude_buddy_ble.

substitutions:
  name: claude-buddy
  friendly_name: Claude Buddy

packages:
  base: !include ../esphome/chicken-base.yaml
  board: !include dial-hardware.yaml
  ui: !include buddy-ui.yaml

logger:
  level: INFO

esphome:
  on_boot:
    - priority: -150  # after buddy-ui.yaml's init
      then:
        - lambda: |-
            buddyui::ui().battery = []() -> int {
              if (id(pmu).isVbusIn() || !id(pmu).isBatteryConnect()) return -1;
              return std::isnan(id(bat_level).state) ? -1 : (int) id(bat_level).state;
            };
            ESP_LOGI("buddy", "Free internal heap %u, largest block %u", heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                     heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));

wifi:
  use_psram: true
  power_save_mode: light  # battery: modem sleeps between beacons; API latency goes up slightly
  fast_connect: true  # saved BSSID + channel, no scan: Wi-Fi in ~1-2 s instead of ~7 s (other networks still cycled)
  # Static, no DHCP wait. 10.0.0.11 is also reserved on the router (MAC 80:45:6B:34:26:3C) so nothing else takes it.
  manual_ip:
    static_ip: 10.0.0.11
    gateway: 10.0.1.1
    subnet: 255.255.254.0
    dns1: 10.0.1.1

# NS4150B amp enable: no audio in this config, so hold it off rather than leave GPIO46 floating.
switch:
  - platform: gpio
    id: speaker_amp
    internal: true
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

