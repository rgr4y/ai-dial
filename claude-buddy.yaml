# Claude Buddy on the ex-Harness dial (Waveshare ESP32-S3-Touch-AMOLED-1.75C).
# Harness's Claude face (pets, arcs, cards; docs/HARNESS-UI-SPEC.md), driven over Wi-Fi by the dial bridge
# (bridge/: Claude Code hooks + peon-ping adapters for Codex, Cursor, ...). Board: dial-hardware.yaml.
# Protocol: docs/DIAL-PROTOCOL.md. Simulator: `npm run dev` in bridge/.
# The BLE transport for Claude desktop's Hardware Buddy is kept, unconfigured, in components/claude_buddy_ble.
#
# Pets: buddy/pets_claude.h is generated by scripts/gen_buddy_pets.mjs. Host test: test_buddy.cpp.

substitutions:
  name: claude-buddy
  friendly_name: Claude Buddy

packages:
  base: !include ../esphome/chicken-base.yaml
  board: !include dial-hardware.yaml

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: components
    components: [claude_buddy]

esphome:
  includes:
    - buddy  # pets_claude.h, scene.h, ui.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            buddyui::init(lv_scr_act(), id(buddy), {
                id(inter_20)->get_lv_font(), id(inter_25)->get_lv_font(), id(inter_26m)->get_lv_font(),
                id(inter_30)->get_lv_font(), id(inter_48b)->get_lv_font(),
                id(inter_96b)->get_lv_font()});
            buddyui::ui().on_state = [](const std::string &s) { id(buddy_ui).publish_state(s); };
            buddyui::ui().battery = []() -> int {
              if (id(pmu).isVbusIn() || !id(pmu).isBatteryConnect()) return -1;
              return std::isnan(id(bat_level).state) ? -1 : (int) id(bat_level).state;
            };
            buddyui::ui().last_state.clear();  // init() drew before the sensor was attached: publish again
            buddyui::publish_state();
            ESP_LOGI("buddy", "Free internal heap %u, largest block %u", heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                     heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));

wifi:
  use_psram: true
  power_save_mode: light  # battery: modem sleeps between beacons; API latency goes up slightly
  fast_connect: true  # saved BSSID + channel, no scan: Wi-Fi in ~1-2 s instead of ~7 s (other networks still cycled)
  # Static, no DHCP wait. 10.0.0.11 is also reserved on the router (MAC 80:45:6B:34:26:3C) so nothing else takes it.
  manual_ip:
    static_ip: 10.0.0.11
    gateway: 10.0.1.1
    subnet: 255.255.254.0
    dns1: 10.0.1.1

claude_buddy:
  id: buddy
  decision_sensor: buddy_decision
  on_update:
    - lambda: buddyui::update(millis());

# ---- Dial bridge (bridge/): every agent's status over Wi-Fi, as Hardware Buddy JSON lines ----
api:
  actions:
    - action: buddy_line
      variables:
        line: string
      then:
        - lambda: id(buddy).feed_line(line);
    # Simulator / remote touch: allow, deny, later, card, bell, hold, back, wake, screen (buddy/ui.h tap()).
    - action: buddy_tap
      variables:
        target: string
      then:
        - lambda: buddyui::tap(target);

text_sensor:
  - platform: template
    id: buddy_decision
    name: Buddy Decision  # "<prompt id> once|deny"; the bridge subscribes to it
  - platform: template
    id: buddy_ui
    name: Buddy UI  # what's on the glass, JSON (docs/DIAL-PROTOCOL.md); the simulator mirrors it
    entity_category: diagnostic

# ---- Fonts: Inter throughout (spec §2 Common) ----
font:
  - { id: inter_20, file: "gfonts://Inter@400", size: 20, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: "…·→" }
  - { id: inter_25, file: "gfonts://Inter@400", size: 25, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: "…·→" }
  - { id: inter_26m, file: "gfonts://Inter@500", size: 26, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: "…·→" }
  - { id: inter_30, file: "gfonts://Inter@400", size: 30, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: "…·→" }
  - { id: inter_48b, file: "gfonts://Inter@700", size: 48, bpp: 4, glyphs: "Claude" }
  - { id: inter_96b, file: "gfonts://Inter@800", size: 96, bpp: 4, glyphs: "0123456789%" }  # usage alarm

lvgl:
  id: lvgl_comp
  displays: [disp]
  # Paused while the screen is dark (interval below). A touch resumes it (resume_on_input, default on), the
  # shield takes the press and wakes the UI.
  on_resume:
    - lambda: id(lvgl_resumed_at) = millis();
  touchscreens: [touch]
  buffer_size: 25%  # largest ESPHome keeps in internal SRAM
  bg_color: 0x000000
  # ui.h builds the screen in C++ on lv_scr_act(). This label only keeps the LVGL font plumbing referenced.
  widgets:
    - label: { hidden: true, text: "", text_font: inter_20 }

interval:
  # Harness redraws code-drawn motion every 50 ms; pets step at 55-120 ms.
  - interval: 50ms
    then:
      - lambda: |-
          buddyui::tick(millis());
          if (buddyui::take_wake()) {
            id(lvgl_comp).set_paused(false, false);
            auto c = id(display_brightness).turn_on();
            c.set_transition_length(300);
            c.perform();
          }
          if (buddyui::take_sleep()) {
            auto c = id(display_brightness).turn_off();
            c.set_transition_length(1000);
            c.perform();
            id(lvgl_comp).set_paused(true, false);  // no renders or flushes while dark
          }
          // A touch resumed LVGL but didn't wake the UI (press missed the shield): pause again after 1 s.
          if (buddyui::ui().asleep && !id(lvgl_comp).is_paused() && millis() - id(lvgl_resumed_at) > 1000)
            id(lvgl_comp).set_paused(true, false);

globals:
  - id: lvgl_resumed_at
    type: uint32_t
    initial_value: "0"

# NS4150B amp enable: no audio in this config, so hold it off rather than leave GPIO46 floating.
switch:
  - platform: gpio
    id: speaker_amp
    internal: true
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - id: !extend btn_pwr
    on_press:  # PWR tap toggles the screen (ptt.c:20-22); via the UI so a dark screen also eats touches
      - lambda: buddyui::toggle_screen(millis());
  - id: !extend btn_boot
    on_click:  # BOOT tap: back to the face (puts off an open prompt), as Harness goes HOME
      - max_length: 600ms
        then:
          - lambda: |-
              auto &u = buddyui::ui();
              if (id(buddy).has_prompt()) u.deferred_id = id(buddy).snap().prompt_id;
              u.entries_open = false;
              buddyui::activity(millis());
              buddyui::update(millis());
