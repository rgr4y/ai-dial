# Claude Buddy on the ex-Harness dial (Waveshare ESP32-S3-Touch-AMOLED-1.75C).
# Harness's Claude face (pets, arcs, cards; docs/HARNESS-UI-SPEC.md), driven over Wi-Fi by the dial bridge
# (bridge/: Claude Code hooks + peon-ping adapters for Codex, Cursor, ...).
# Board: dial-hardware.yaml. UI: buddy-ui.yaml. Desktop simulator of the same code: claude-buddy-sim.yaml.
# Protocol: docs/DIAL-PROTOCOL.md.

substitutions:
  name: claude-buddy
  friendly_name: Claude Buddy
  # Audio (from docs/esp32-dial.yaml). 16 kHz: voice_assistant needs a 16 kHz mic, and the mic and speaker share one
  # full-duplex I2S bus (one rate for both), so sounds play at 16 kHz. The slider (1-100) maps linearly onto the usable range: below volume_min it's
  # inaudible, above volume_max it distorts. ES8311 reg 0x32: 0.75 = 0dB (0xBF), each 0.01 is about 1dB. 0 = mute.
  i2s_bps: 16bit
  i2s_sample_rate: "16000"
  volume_min: "0.60"
  volume_max: "0.72"

packages:
  base: !include ../esphome/chicken-base.yaml
  board: !include dial-hardware.yaml
  ui: !include buddy-ui.yaml

logger:
  level: DEBUG          # compiled in, so single tags can opt in below
  initial_level: INFO   # everything else stays at INFO
  logs:
    btn: DEBUG          # PWR / BOOT presses (buddy-ui.yaml)

web_server:
    ota: false
esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute:
            id: apply_current_volume
            displayed_volume: !lambda "return id(speaker_volume_percent).state;"
    - priority: -150  # after buddy-ui.yaml's init
      then:
        - lambda: |-
            buddyui::ui().battery = []() -> int {
              if (!id(pmu).isBatteryConnect()) return -1;
              return std::isnan(id(bat_level).state) ? -1 : (int) id(bat_level).state;
            };
            buddyui::ui().on_usb = []() { return id(pmu).isVbusIn(); };
            id(imu)->add_listener([](const motion::MotionData &d) {
              gaze::update(d.acceleration[0], d.acceleration[1], d.acceleration[2], millis());
            });
            // Hold the face (buddy/ui.h on_hold): the dial streams mic audio to the bridge, which is the voice_assistant's
            // API client. No subscriber (bridge down, or Home Assistant got there first) = no start.
            buddyui::ui().on_voice = [](bool on) -> bool {
              if (!on) {
                id(va)->request_stop();
                return true;
              }
              if (id(va)->get_api_connection() == nullptr || id(va)->is_running()) return false;
              id(va)->request_start(false, false);  // not continuous, no silence detection: the release ends it
              return true;
            };
            ESP_LOGI("buddy", "Free internal heap %u, largest block %u", heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                     heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));

wifi:
  use_psram: true
  power_save_mode: light  # battery: modem sleeps between beacons; API latency goes up slightly
  fast_connect: true  # saved BSSID + channel, no scan: Wi-Fi in ~1-2 s instead of ~7 s (other networks still cycled)
  # Static, no DHCP wait. 10.0.0.11 is also reserved on the router (MAC 80:45:6B:34:26:3C) so nothing else takes it.
  manual_ip:
    static_ip: 10.0.0.11
    gateway: 10.0.1.1
    subnet: 255.255.254.0
    dns1: 10.0.1.1

# Update progress page (buddy/ui.h ota()). Extends the base OTA: same-port esphome entries merge, password kept.
# The upload blocks the main loop, so the 50 ms interval doesn't run: wake the panel here, and ota() draws itself.
ota:
  - platform: esphome
    on_begin:
      - lambda: |-
          id(lvgl_comp).set_paused(false, false);
          auto c = id(display_brightness).turn_on();
          c.set_transition_length(0);
          c.perform();
          buddyui::ota(1, 0, 0);
    on_progress:
      - lambda: buddyui::ota(2, x, 0);
    on_end:
      - lambda: buddyui::ota(0, 100, 0);
    on_error:
      - lambda: buddyui::ota(4, 0, x);
    on_abort:
      - lambda: buddyui::ota(3, 0, 0);
    encryption: 

# ---- IMU: QMI8658 @0x6B (INT1 GPIO21, not wired in). Steers the pets' eyes while the dial moves (buddy/gaze.h). ----
# axis_map puts +x at screen right and +y at screen down (unverified on the dial: tilt it and check the eyes follow).
# Polled at the UI tick; stopped while the screen is dark so I2C doesn't hold the APB_MAX PM lock for nothing.
motion:
  - platform: qmi8658
    id: imu
    i2c_id: bus_a
    accelerometer_odr: 125HZ
    gyroscope_odr: 125HZ
    update_interval: 50ms
    axis_map: { x: x, y: y, z: z }

lvgl:
  on_pause:
    - lambda: |-
        id(imu)->stop_poller();
        gaze::reset();
  on_resume:
    - lambda: id(imu)->start_poller();

# ---- CPU speed. dial-hardware.yaml scales 240/80/40 MHz; on its own LVGL draws at 40 (it takes no PM lock). Hold a
# CPU_FREQ_MAX lock (240) while the screen is on and either USB is in or the dial booted under 120 s ago. Dark, or on
# battery after that: back to scaling.
interval:
  - interval: 1s
    then:
      - lambda: |-
          static esp_pm_lock_handle_t lock = nullptr;
          static bool held = false;
          if (!lock && esp_pm_lock_create(ESP_PM_CPU_FREQ_MAX, 0, "awake", &lock) != ESP_OK) return;
          bool usb = id(pmu).isVbusIn(), want = !buddyui::ui().asleep && (usb || millis() < 120000);
          if (want == held) return;
          (want ? esp_pm_lock_acquire : esp_pm_lock_release)(lock);
          held = want;
          ESP_LOGI("power", "CPU %s (screen %s, usb %d, up %us)", want ? "240 MHz" : "scaling",
                   buddyui::ui().asleep ? "dark" : "on", usb, (unsigned) (millis() / 1000));

# ---- Audio: ES8311 DAC -> NS4150B amp, ES7210 ADC (mic data GPIO10) on the same I2S bus ----
# Speaker, mixer, resamplers and media player from docs/esp32-dial.yaml (no boot stream). Mixer and resampler layout
# from esphome-touchs3/esphome-touch-s3.yaml. One bus, full duplex (ESPHome 2026.11, #19959): mic and speaker must
# agree on rate, bits, mclk multiple.
i2s_audio:
  - id: i2s_out
    full_duplex: true
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true  # board wiring: I2S WS
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

audio_dac:
  - platform: es8311
    id: dac
    i2c_id: bus_a
    bits_per_sample: ${i2s_bps}
    sample_rate: ${i2s_sample_rate}

# ES7210: I2C 0x40, clocked from the ESP's MCLK (256 x rate, which its driver hard-codes). 37.5 dB is the vendor firmware's
# mic gain (docs/FIRMWARE-OPTIONS.md); lower it if the transcript clips.
audio_adc:
  - platform: es7210
    id: adc
    i2c_id: bus_a
    bits_per_sample: ${i2s_bps}
    sample_rate: ${i2s_sample_rate}
    mic_gain: 37.5dB

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_out
    i2s_din_pin: GPIO10
    adc_type: external
    pdm: false
    bits_per_sample: ${i2s_bps}
    sample_rate: ${i2s_sample_rate}

# Audio goes out to the bridge (dial-bridge.mjs), not Home Assistant. Only one API client can subscribe; if HA adds the
# dial and subscribes first, the bridge is refused (ESPHome logs "Multiple API Clients attempting to connect").
voice_assistant:
  id: va
  microphone: mic

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: dac
    bits_per_sample: ${i2s_bps}
    sample_rate: ${i2s_sample_rate}
    channel: mono
    buffer_duration: 500ms
  - platform: mixer
    id: speaker_out
    output_speaker: spk
    source_speakers:
      - id: announcement_mixing_input
        buffer_duration: 300ms
        timeout: 500ms
      - id: media_mixing_input
        buffer_duration: 100ms
        timeout: 500ms
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_mixing_input
    sample_rate: ${i2s_sample_rate}
    buffer_duration: 200ms
  - platform: resampler
    id: media_resampler
    output_speaker: media_mixing_input
    sample_rate: ${i2s_sample_rate}
    buffer_duration: 100ms

media_player:
  - platform: speaker
    id: player
    # Read buffer per pipeline, in PSRAM. The old dial config used 2MB for its MP3 stream; 512KB each here, since the
    # character pack also lives in PSRAM.
    buffer_size: 512000
    announcement_pipeline:
      speaker: announcement_resampler
      format: WAV
      sample_rate: ${i2s_sample_rate}
      num_channels: 1
    media_pipeline:
      speaker: media_resampler
      format: NONE  # every codec (the default, FLAC only, rejected MP3 with ESP_ERR_NOT_SUPPORTED)
      num_channels: 1  # the ES8311 is mono, so decode straight to mono
    # Amp on only while something plays: left on while idle, the speaker picks up RF noise.
    on_play:
      - switch.turn_on: speaker_amp
    on_announcement:
      - switch.turn_on: speaker_amp
    on_idle:
      - switch.turn_off: speaker_amp
    on_pause:
      - switch.turn_off: speaker_amp
    on_turn_off:
      - switch.turn_off: speaker_amp

number:
  - platform: template
    id: speaker_volume_percent
    name: Speaker Volume
    icon: mdi:volume-high
    optimistic: true
    restore_value: true
    initial_value: 50
    min_value: 0
    max_value: 100
    step: 1
    mode: slider
    set_action:
      - script.execute:
          id: apply_current_volume
          displayed_volume: !lambda "return x;"

script:
  - id: apply_current_volume
    parameters:
      displayed_volume: float
    then:
      - media_player.volume_set:
          id: player
          volume: !lambda |-
            if (displayed_volume <= 0) return 0.0f;
            return ${volume_min} + (${volume_max} - ${volume_min}) * displayed_volume / 100.0f;

switch:
  - platform: gpio
    id: speaker_amp  # NS4150B enable
    name: Speaker Amp
    pin:
      number: GPIO46
      ignore_strapping_warning: true  # board wiring: amp enable
    restore_mode: ALWAYS_OFF  # the media player turns it on to play (above)

