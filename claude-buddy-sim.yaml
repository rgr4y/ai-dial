# Desktop simulator: the dial's real UI code (buddy-ui.yaml: buddy/ui.h, scene.h, character.h, LVGL) built for the
# host against an SDL window instead of the AMOLED. UI changes are previewed here before they go to the dial.
#
#   esphome run claude-buddy-sim.yaml     # needs SDL2 (brew install sdl2-compat)
#
# The bridge drives it like the dial over the native API on 127.0.0.1:6053: add 127.0.0.1 to DIAL_HOST.
# Pets load straight from bridge/assets ($DIAL_ASSETS overrides), no LittleFS or sync.
# Mouse = touch. PWR / BOOT: click the keys on the case edge, or press p / b with the window focused.
# Battery stand-in (no PMU here): [ / ] = battery -10 / +10 %, u = toggle USB power.

substitutions:
  name: claude-buddy-sim
  friendly_name: Claude Buddy Sim
  # The 466 glass sits centred in a bigger window (WIN - 466) / 2 in, so the case and keys fit around it.
  ui_root: >-
    [] { lv_obj_t *o = lv_obj_create(lv_scr_act()); lv_obj_remove_style_all(o);
         lv_obj_set_size(o, 466, 466); lv_obj_set_pos(o, 87, 87); return o; }()

host:

logger:
  level: DEBUG          # compiled in, so single tags can opt in below
  initial_level: INFO   # everything else stays at INFO
  logs:
    btn: DEBUG          # PWR / BOOT presses (buddy-ui.yaml)

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key  # same key as the dial, so the bridge needs nothing extra

packages:
  ui: !include buddy-ui.yaml

# Dressing on the top layer (never touchable except the keys): case at true scale (55 mm case / 43.76 mm glass,
# Waveshare size drawing), corners masked, glass edge ringed, PWR and BOOT on the right edge where the real
# ones are (~1:30 and ~4 o'clock seen from the front). Clicking a key drives the same binary sensor as its hotkey (hit-tested in touchscreen:).
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # Remember the window position across runs (macOS forgets SDL windows): restored here, saved on every move.
    # sdl2-compat window ids aren't predictable, so find ours by scanning.
    - priority: -200
      then:
        - lambda: |-
            int x, y;
            FILE *f = fopen("build/sim-window.pos", "r");
            if (f && fscanf(f, "%d %d", &x, &y) == 2)
              for (uint32_t i = 1; i < 1000; i++)
                if (SDL_Window *w = SDL_GetWindowFromID(i)) {
                  SDL_SetWindowPosition(w, x, y);
                  break;
                }
            if (f) fclose(f);
            SDL_AddEventWatch([](void *, SDL_Event *e) -> int {
              if (e->type == SDL_WINDOWEVENT && e->window.event == SDL_WINDOWEVENT_MOVED)
                if (FILE *f = fopen("build/sim-window.pos", "w")) {
                  fprintf(f, "%d %d\n", e->window.data1, e->window.data2);
                  fclose(f);
                }
              return 0;
            }, nullptr);
    # The dial sets these from the PMU in claude-buddy.yaml (same priority, after buddy-ui.yaml's init).
    - priority: -150
      then:
        - lambda: |-
            buddyui::ui().battery = []() { return id(sim_bat); };
            buddyui::ui().on_usb = []() { return id(sim_usb); };
            // No mic here: holding the face fakes the bridge. Words arrive every 400 ms while held; 700 ms after the
            // release comes the final (empty if released at once = "Didn't catch that"). The interval below feeds them.
            buddyui::ui().on_voice = [](bool on) -> bool {
              id(sim_voice_on) = on;
              if (on) id(sim_voice_n) = -1, id(sim_voice_at) = millis(), id(sim_voice_final_at) = 0;
              else id(sim_voice_final_at) = millis() + 700;
              return true;
            };
    - priority: -200
      then:
        - lambda: |-
            // SDL keys never publish a starting state, so ESPHome would treat the first press as the initial
            // state and skip its triggers. The dial's GPIO keys publish theirs in setup.
            id(btn_pwr).publish_initial_state(false);
            id(btn_boot).publish_initial_state(false);
            id(btn_bat_dn).publish_initial_state(false);
            id(btn_bat_up).publish_initial_state(false);
            id(btn_usb).publish_initial_state(false);
            using namespace sim_keys;
            auto ring = [](int size, int width, uint32_t color) {
              lv_obj_t *o = lv_obj_create(lv_layer_top());
              lv_obj_remove_style_all(o);
              lv_obj_set_size(o, size, size);
              lv_obj_set_pos(o, C - size / 2, C - size / 2);
              lv_obj_set_style_radius(o, LV_RADIUS_CIRCLE, 0);
              lv_obj_set_style_border_width(o, width, 0);
              lv_obj_set_style_border_color(o, lv_color_hex(color), 0);
              lv_obj_set_style_border_opa(o, LV_OPA_COVER, 0);
              lv_obj_set_clickable(o, false);
            };
            lv_obj_set_style_bg_color(lv_scr_act(), lv_color_hex(0x101014), 0);
            ring(CASE + 2 * 60, 60, 0x101014);         // window outside the case (covers the UI square's corners)
            ring(CASE, (CASE - D) / 2, 0x2c2e36);      // case bezel
            ring(CASE, 2, 0x4a4c56);                   // case rim
            ring(D, 1, 0x5a5c66);                      // glass edge

            auto key = [](Key key, binary_sensor::BinarySensor *bs) {
              lv_obj_t *k = lv_obj_create(lv_layer_top());
              lv_obj_remove_style_all(k);
              lv_obj_set_size(k, KW, KH);
              lv_obj_set_pos(k, cx(key) - KW / 2, cy(key) - KH / 2);
              lv_obj_set_style_radius(k, KW / 2, 0);
              lv_obj_set_style_bg_opa(k, LV_OPA_COVER, 0);
              lv_obj_set_style_bg_color(k, lv_color_hex(0x8a8c96), 0);
              lv_obj_set_style_bg_color(k, lv_color_hex(0xd8dae2), LV_STATE_PRESSED);
              lv_obj_set_style_transform_pivot_x(k, KW / 2, 0);
              lv_obj_set_style_transform_pivot_y(k, KH / 2, 0);
              lv_obj_set_style_transform_rotation(k, (int) (DEG[key] * 10), 0);
              lv_obj_set_clickable(k, true);  // no handlers (touchscreen: hit-tests the keys), but eats the press so it can't reach the UI root
              lv_obj_set_ext_click_area(k, REACH);
              bs->add_on_state_callback([k](bool on) { (on ? lv_obj_add_state : lv_obj_remove_state)(k, LV_STATE_PRESSED); });
              lv_obj_t *l = lv_label_create(lv_layer_top());
              lv_label_set_text(l, NAME[key]);
              lv_obj_set_style_text_font(l, id(inter_20)->get_lv_font(), 0);
              lv_obj_set_style_text_color(l, lv_color_hex(0x8a8c96), 0);
              lv_obj_update_layout(l);
              lv_obj_set_pos(l, cx(key, LR) - lv_obj_get_width(l) / 2, cy(key, LR) - lv_obj_get_height(l) / 2);
            };
            key(PWR, id(btn_pwr));
            key(BOOT, id(btn_boot));

# ---- Board side (replaces dial-hardware.yaml) ----
display:
  - platform: sdl
    id: disp
    dimensions:
      width: 640
      height: 640
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: sdl
    id: touch
    display: disp
    # Case keys are hit-tested here, not as LVGL events: a paused LVGL (dark screen) drops presses (buddy/sim_keys.h).
    on_touch:
      - lambda: |-
          switch (sim_keys::hit(touch.x, touch.y)) {
            case sim_keys::PWR: id(btn_pwr).publish_state(true); break;
            case sim_keys::BOOT: id(btn_boot).publish_state(true); break;
            default: break;
          }
    on_release:
      - lambda: |-
          for (auto *bs : {id(btn_pwr), id(btn_boot)})
            if (bs->state) bs->publish_state(false);

output:
  - platform: template
    id: panel_brightness
    type: float
    write_action:
      # The panel going dark: LVGL is already paused (buddy-ui.yaml interval), so black the glass by hand.
      # Wake resumes LVGL, which invalidates the whole screen and redraws it.
      - lambda: 'ESP_LOGD("sim", "brightness %.0f%%", state * 100);'
      - if:
          condition: { lambda: return state == 0; }
          then: { script.execute: black_glass }

# A touch on the dark glass (or the release of the sleep click) resumes LVGL, which repaints the stale UI before the
# interval pauses it again. Re-black at that pause while the panel is off.
lvgl:
  on_pause:
    - if:
        condition: { lambda: 'return !id(display_brightness).current_values.is_on();' }
        then: { script.execute: black_glass }

script:
  - id: black_glass
    then:
      - lambda: |-
          id(disp).filled_circle(320, 320, 232, Color::BLACK);
          id(disp).update();

light:
  - platform: monochromatic
    id: display_brightness
    output: panel_brightness
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

globals:
  - { id: sim_voice_on, type: bool, initial_value: "false" }
  - { id: sim_voice_n, type: int, initial_value: "0" }
  - { id: sim_voice_at, type: uint32_t, initial_value: "0" }
  - { id: sim_voice_final_at, type: uint32_t, initial_value: "0" }
  - { id: sim_bat, type: int, initial_value: "80" }
  - { id: sim_usb, type: bool, initial_value: "false" }

binary_sensor:
  - { platform: sdl, id: btn_boot, key: SDLK_b }
  - { platform: sdl, id: btn_pwr, key: SDLK_p }
  - platform: sdl
    id: btn_bat_dn
    key: SDLK_LEFTBRACKET
    on_press:
      - lambda: |-
          id(sim_bat) = std::max(0, id(sim_bat) - 10);
          ESP_LOGI("sim", "battery %d%% usb %d", id(sim_bat), id(sim_usb));
  - platform: sdl
    id: btn_bat_up
    key: SDLK_RIGHTBRACKET
    on_press:
      - lambda: |-
          id(sim_bat) = std::min(100, id(sim_bat) + 10);
          ESP_LOGI("sim", "battery %d%% usb %d", id(sim_bat), id(sim_usb));
  - platform: sdl
    id: btn_usb
    key: SDLK_u
    on_press:
      - lambda: |-
          id(sim_usb) = !id(sim_usb);
          ESP_LOGI("sim", "battery %d%% usb %d", id(sim_bat), id(sim_usb));

  # Fake IMU: arrow keys tip the dial 25 deg that way while held, or drag with the right mouse button: the dial tips
  # toward the pointer, up to 40 deg at the glass edge (the left button stays the touchscreen). The dial's qmi8658:
  # claude-buddy.yaml.
  - { platform: sdl, id: tilt_l, key: SDLK_LEFT }
  - { platform: sdl, id: tilt_r, key: SDLK_RIGHT }
  - { platform: sdl, id: tilt_u, key: SDLK_UP }
  - { platform: sdl, id: tilt_d, key: SDLK_DOWN }

interval:
  # Pin: while build/sim-pin.jsonl exists the sim ignores the bridge and plays that file instead (one buddy_line per
  # line, docs/DIAL-PROTOCOL.md): every line when the file changes, its heartbeats again every 5 s to stay live.
  # Delete the file to hand the face back to the bridge (its next heartbeat, 10 s at most).
  - interval: 500ms
    then:
      - lambda: |-
          static std::string seen;
          static uint32_t fed = 0;
          FILE *f = fopen("build/sim-pin.jsonl", "r");
          bool on = f != nullptr;
          if (on != id(buddy).mute_api) ESP_LOGI("sim", "pin %s", on ? "on: bridge ignored" : "off: bridge back");
          id(buddy).mute_api = on;
          if (!on) { seen.clear(); return; }
          std::string all;
          static char buf[8192];
          while (size_t n = fread(buf, 1, sizeof(buf), f)) all.append(buf, n);
          fclose(f);
          bool changed = all != seen;  // content, not mtime: two clicks in one second share an mtime
          if (!changed && millis() - fed < 5000) return;
          seen = all, fed = millis();
          for (size_t i = 0, j; i < all.size(); i = j + 1) {
            j = all.find('\n', i);
            if (j == std::string::npos) j = all.size();
            std::string l = all.substr(i, j - i);
            if (!l.empty() && l.back() == '\r') l.pop_back();
            if (!l.empty() && l[0] == '{' && (changed || l.find("\"total\"") != std::string::npos)) id(buddy).feed_line(l);
          }
  - interval: 200ms  # fake voice (on_voice above): the words, as the bridge would send them
    then:
      - lambda: |-
          static const char *const W[] = {"fix", "the", "failing", "test", "in", "the", "auth", "module"};
          auto say = [](const char *key, int n) {
            std::string t;
            for (int i = 0; i < n; i++) t += (i ? " " : "") + std::string(W[i]);
            id(buddy).feed_line(std::string("{\"evt\":\"voice\",\"") + key + "\":\"" + t + "\"}");
          };
          if (id(sim_voice_on)) {
            int n = std::min<int>(8, (millis() - id(sim_voice_at)) / 400);
            if (n != id(sim_voice_n)) say("text", id(sim_voice_n) = n);
          } else if (id(sim_voice_final_at) && millis() >= id(sim_voice_final_at)) {
            id(sim_voice_final_at) = 0;
            say("final", std::max(id(sim_voice_n), 0));
          }
  - interval: 50ms  # the dial's IMU poll rate
    then:
      - lambda: |-
          float s = sinf(25 * 3.14159265f / 180);
          float ax = s * (id(tilt_r).state - id(tilt_l).state), ay = s * (id(tilt_d).state - id(tilt_u).state);
          int mx, my;
          if (SDL_GetMouseState(&mx, &my) & SDL_BUTTON_RMASK) {
            float k = sinf(40 * 3.14159265f / 180) / 233;  // window px from the glass centre -> sin(tilt)
            ax = fmaxf(-0.9f, fminf(0.9f, (mx - sim_keys::C) * k));
            ay = fmaxf(-0.9f, fminf(0.9f, (my - sim_keys::C) * k));
          }
          gaze::update(ax, ay, sqrtf(fmaxf(0, 1 - ax * ax - ay * ay)), millis());
